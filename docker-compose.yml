version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supplychain-backend
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/exports:/app/exports
    networks:
      - supplychain-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supplychain-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      - VITE_API_BASE_URL=http://backend:4000
    depends_on:
      - backend
    networks:
      - supplychain-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    networks:
      - supplychain-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3002:3000"   # 3002 on host to avoid conflict with frontend
    networks:
      - supplychain-net
    depends_on:
      - prometheus


networks:
  supplychain-net:
    driver: bridge

